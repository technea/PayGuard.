name: x402 SDK probe (temporary)

'on':
  push:
    branches:
      - scratch/x402-sdk-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile for the pinned devDependency
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "=====BEGIN-LOCK====="; cat package-lock.json; echo "=====END-LOCK====="
      - name: Prove the lockfile is in sync (npm ci) and the pin is exact
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          node -p "'resolved @x402/core = ' + require('./node_modules/@x402/core/package.json').version"
