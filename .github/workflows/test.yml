name: PayGuard CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build distributable artifacts
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check distributable syntax
        run: node --check dist/plugin.mjs
      - name: Check CommonJS distributable syntax
        run: node --check dist/index.cjs
      - name: Verify CommonJS adapter exports
        run: node -e "const p = require('./dist/index.cjs'); if (typeof p.createPayGuardX402Hook !== 'function' || typeof p.registerPayGuardX402 !== 'function') process.exit(1); console.log('CommonJS x402 adapter exports verified.');"
      - name: Verify plugin exports
        run: >-
          node --input-type=module -e "
          import('./dist/plugin.mjs').then(({default: p}) => {
            const required = [
              'payguard_check_payment_intent',
              'payguard_analyze_url',
              'payguard_prepare_threat_report',
              'payguard_inspect_calldata',
              'payguard_check_token_security',
              'payguard_check_address_security',
              'payguard_scan_wallet_tokens'
            ];
            if (!p || !Array.isArray(p.tools) || p.tools.length < required.length) process.exit(1);
            const names = p.tools.map(t => t.name);
            if (new Set(names).size !== names.length) process.exit(1);
            const missing = required.filter(name => !names.includes(name));
            if (missing.length) {
              console.error('Missing required plugin tools:', missing.join(', '));
              process.exit(1);
            }
            console.log('Verified plugin exports:', names.join(', '));
          }).catch(error => { console.error(error); process.exit(1); })"
