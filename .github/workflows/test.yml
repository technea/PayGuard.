name: PayGuard CI

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check distributable syntax
        run: node --check dist/plugin.mjs
      - name: Check API server syntax
        run: node --check server.mjs
      - name: Verify plugin exports
        run: >-
          node --input-type=module -e "import('./dist/plugin.mjs').then(({default: p}) => { if (!p || p.tools.length !== 3) process.exit(1); console.log(p.tools.map(t => t.name).join(', ')); })"
